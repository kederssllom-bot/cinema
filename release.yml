name: Build APK and Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install

      - name: Prepare web folder
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Create Android project
        run: npx cap add android

      - name: Set app icon
        run: |
          pip install pillow
          python3 - <<'PY'
          import os
          from PIL import Image
          base = "icons/icon-512.png"
          fg = "icons/icon-maskable-512.png"
          if not os.path.exists(fg):
              fg = base
          legacy = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          adaptive = {"mdpi": 108, "hdpi": 162, "xhdpi": 216, "xxhdpi": 324, "xxxhdpi": 432}
          res = "android/app/src/main/res"
          for d, s in legacy.items():
              folder = f"{res}/mipmap-{d}"
              os.makedirs(folder, exist_ok=True)
              img = Image.open(base).convert("RGBA").resize((s, s), Image.LANCZOS)
              img.save(f"{folder}/ic_launcher.png")
              img.save(f"{folder}/ic_launcher_round.png")
          for d, s in adaptive.items():
              folder = f"{res}/mipmap-{d}"
              img = Image.open(fg).convert("RGBA").resize((s, s), Image.LANCZOS)
              img.save(f"{folder}/ic_launcher_foreground.png")
          bg = f"{res}/values/ic_launcher_background.xml"
          with open(bg, "w") as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#050505</color>\n</resources>\n')
          PY

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publish download link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk WatchNow.apk
          gh release delete latest --yes --cleanup-tag --repo ${{ github.repository }} || true
          gh release create latest WatchNow.apk --repo ${{ github.repository }} --title "WatchNow" --notes "Latest Android build" --latest
